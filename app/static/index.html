<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>财报解读 Agent · 对话</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F3F3F3;
  --card: #FFFFFF;
  --border: rgba(0,0,0,0.07);
  --text: #1A1A1A;
  --text2: #616161;
  --accent: #0067C0;
  --accent-soft: rgba(0,103,192,0.09);
  --green: #0F7B0F;
  --red: #C42B1C;
  --radius: 8px;
  --shadow: 0 2px 12px rgba(0,0,0,0.05);
}
html, body { height: 100%; }
body {
  font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.55;
  display: flex;
  flex-direction: column;
  min-width: 720px;
  overflow: hidden;
}

/* ===== 顶栏（Mica 磨砂）===== */
.topbar {
  flex: 0 0 56px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border);
}
.topbar .left { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, #0067C0, #3B8EDC);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
}
.logo svg { width: 16px; height: 16px; }
.topbar h1 { font-size: 15.5px; font-weight: 600; }
.topbar .right { display: flex; align-items: center; gap: 16px; }
.status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }
.btn-ghost {
  border: 1px solid rgba(0,0,0,0.12);
  background: rgba(255,255,255,0.8);
  border-radius: 6px;
  padding: 5px 12px;
  font-size: 12px; font-family: inherit; color: var(--text2);
  cursor: pointer;
  transition: all .12s;
}
.btn-ghost:hover { background: rgba(0,0,0,0.04); color: var(--text); }

/* ===== 对话主区 ===== */
.chat-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.chat-scroll {
  flex: 1; overflow-y: auto;
  padding: 28px max(24px, calc((100% - 860px) / 2));
  display: flex; flex-direction: column; gap: 22px;
}

/* 消息气泡 */
.msg { display: flex; flex-direction: column; max-width: 84%; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.ai { align-self: flex-start; }
.bubble { padding: 11px 16px; border-radius: 14px; font-size: 14px; line-height: 1.65; }
.msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
.msg.ai .bubble {
  background: var(--card); border: 1px solid var(--border);
  box-shadow: var(--shadow); border-bottom-left-radius: 5px;
  width: 100%;
}
.agent-tag {
  align-self: flex-start;
  font-size: 11px; color: var(--accent);
  background: var(--accent-soft);
  border-radius: 10px; padding: 2px 10px;
  margin-bottom: 5px;
  display: inline-flex; align-items: center; gap: 4px;
}

/* 思考中 */
.typing { display: inline-flex; gap: 5px; align-items: center; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: #B0B0B0; animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* Markdown */
.answer-card h2 { font-size: 16px; margin: 12px 0 7px; }
.answer-card h3 { font-size: 14.5px; margin: 10px 0 5px; }
.answer-card p { margin: 5px 0; }
.answer-card ul, .answer-card ol { margin: 5px 0 5px 22px; }
.answer-card li { margin: 3px 0; }
.answer-card code { background: rgba(0,0,0,0.06); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; font-family: Consolas, monospace; }
.answer-card table { margin: 8px 0; border-collapse: collapse; }
.answer-card th, .answer-card td { border: 1px solid var(--border); padding: 6px 10px; font-size: 13px; }
.answer-card blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--text2); margin: 6px 0; }

/* 回复 meta（来源/评分/日志/下载）*/
.reply-meta { font-size: 12px; color: var(--text2); margin-top: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.src-toggle { border: none; background: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 0; font-family: inherit; }
.src-toggle:hover { text-decoration: underline; }
.src-panel { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 6px; }
.src-item { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.src-item:last-child { border-bottom: none; }
.src-item .idx { flex: 0 0 24px; height: 24px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 600; }
.rating { display: flex; gap: 5px; align-items: center; }
.rating button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.14); background: #fff; font-size: 12px; cursor: pointer; font-family: inherit; transition: all .12s; }
.rating button:hover { border-color: var(--accent); color: var(--accent); }
.rating button.chosen { background: var(--accent); color: #fff; border-color: var(--accent); }
.logs-panel { margin-top: 8px; background: #202020; color: #E8E8E8; border-radius: 6px; font-family: Consolas, monospace; font-size: 11.5px; padding: 10px 12px; white-space: pre-wrap; }
.dl-btn { border: none; background: var(--accent); color: #fff; border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
.dl-btn:hover { filter: brightness(1.1); }

/* ===== 输入条 ===== */
.chat-inputbar {
  flex: 0 0 auto;
  padding: 14px max(24px, calc((100% - 860px) / 2)) 20px;
  background: rgba(255,255,255,0.45);
  backdrop-filter: blur(24px);
  border-top: 1px solid var(--border);
}
.inputbox {
  display: flex; gap: 10px; align-items: flex-end;
  background: var(--card); border: 1px solid rgba(0,0,0,0.12);
  border-radius: 12px; padding: 10px 14px;
  box-shadow: var(--shadow);
  max-width: 860px; margin: 0 auto;
}
.inputbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.inputbox textarea {
  flex: 1; border: none; outline: none; resize: none;
  font-family: inherit; font-size: 14px; line-height: 1.5;
  max-height: 130px; background: transparent; padding: 6px 2px;
}
.send-btn {
  border: none; border-radius: 8px; background: var(--accent); color: #fff;
  width: 36px; height: 36px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 36px; transition: filter .12s;
}
.send-btn:hover { filter: brightness(1.1); }
.send-btn:disabled { opacity: .5; cursor: not-allowed; }

.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: #323232; color: #fff;
  padding: 12px 20px; border-radius: 6px; font-size: 13px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  opacity: 0; transform: translateY(8px);
  transition: all .2s; z-index: 100;
}
.toast.show { opacity: 1; transform: translateY(0); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.35); background-clip: content-box; border: 2px solid transparent; }
</style>
</head>
<body>

<div class="topbar">
  <div class="left">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5v8l-9 5-9-5V8l9-5z"/><path d="M3.5 8.5L12 13l8.5-4.5M12 13v8"/></svg>
    </div>
    <div>
      <h1>Agent</h1>
    </div>
  </div>
  <div class="right">
    <span class="status"><span class="status-dot" id="svcDot"></span><span id="svcText">检测中</span></span>
    <button class="btn-ghost" onclick="clearChat()">清空对话</button>
  </div>
</div>

<div class="chat-wrap">
  <div class="chat-scroll" id="chatScroll">
  </div>

  <div class="chat-inputbar">
    <div class="inputbox">
      <textarea id="qaInput" rows="1" placeholder="提问财报问题，如「茅台 2025 年一季度毛利率」「宁德时代近三年盈利趋势」「数据概览」…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send-btn" id="qaBtn" onclick="askAgent()" title="发送">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const chatScroll = $("chatScroll");

function toast(msg, ms = 2600) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), ms);
}

async function jfetch(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = data.detail;
    let msg;
    if (typeof d === "string") msg = d;
    else if (Array.isArray(d) && d.length) msg = d.map(x => x.msg || JSON.stringify(x)).join("; ");
    else if (d && typeof d === "object") msg = d.msg || JSON.stringify(d);
    else msg = data.error || ("请求失败 " + res.status);
    throw new Error(msg);
  }
  return data;
}

/* ===== Markdown 极简渲染 ===== */
function mdEscape(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function mdInline(s) {
  return mdEscape(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>");
}
function mdToHtml(md) {
  const lines = String(md).split("\n");
  let html = "", inList = false, inTable = false, tableRows = [];
  const closeList = () => { if (inList) { html += "</ul>"; inList = false; } };
  const flushTable = () => {
    if (!tableRows.length) return;
    const header = tableRows[0].map(mdInline);
    const body = tableRows.slice(2).filter(r => !/^[\s:|-]+$/.test(r.join("|")));
    html += "<table><thead><tr>" + header.map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>";
    for (const r of body) html += "<tr>" + r.map(c => "<td>" + mdInline(c) + "</td>").join("") + "</tr>";
    html += "</tbody></table>";
    tableRows = [];
  };
  for (const line of lines) {
    const t = line.trimEnd();
    if (!t) { closeList(); flushTable(); inTable = false; continue; }
    const h = t.match(/^(#{1,4})\s+(.*)/);
    if (h) { closeList(); flushTable(); inTable = false;
      const lv = Math.min(h[1].length + 1, 4);
      html += "<h" + lv + ">" + mdInline(h[2]) + "</h" + lv + ">"; continue; }
    if (/^\|/.test(t)) {
      closeList();
      const cells = t.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      if (!inTable) { tableRows = []; inTable = true; }
      tableRows.push(cells);
      continue;
    }
    flushTable(); inTable = false;
    const li = t.match(/^\s*[-*]\s+(.*)/);
    if (li) { if (!inList) { html += "<ul>"; inList = true; } html += "<li>" + mdInline(li[1]) + "</li>"; continue; }
    closeList();
    if (/^---/.test(t)) { continue; }
    html += "<p>" + mdInline(t) + "</p>";
  }
  closeList(); flushTable();
  return html;
}

/* ===== 消息管理 ===== */
function scrollChat() { chatScroll.scrollTop = chatScroll.scrollHeight; }

function appendMsg(role, html) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = html;
  wrap.appendChild(b);
  chatScroll.appendChild(wrap);
  scrollChat();
  return wrap;
}

function appendTyping() {
  const wrap = document.createElement("div");
  wrap.className = "msg ai";
  const tag = document.createElement("div");
  tag.className = "agent-tag";
  tag.textContent = "⏳ 正在识别意图…";
  const b = document.createElement("div");
  b.className = "bubble typing";
  b.innerHTML = "<span></span><span></span><span></span>";
  wrap.appendChild(tag);
  wrap.appendChild(b);
  chatScroll.appendChild(wrap);
  scrollChat();
  // 阶段文本由 SSE 事件实时更新（见 handleSSE）
  wrap._stopTyping = () => {};
  return wrap;
}

/* ===== AI 回复渲染（按财报意图）===== */
function renderReply(r) {
  const wrap = document.createElement("div");
  wrap.className = "msg ai";
  const tag = document.createElement("div");
  tag.className = "agent-tag";
  tag.textContent = "● " + (r.agent || "Agent");
  wrap.appendChild(tag);

  const b = document.createElement("div");
  b.className = "bubble answer-card";
  b.innerHTML = mdToHtml(r.reply);
  wrap.appendChild(b);

  const meta = document.createElement("div");
  meta.className = "reply-meta";
  const m = r.meta || {};

  // 指标查询：公司 · 指标 · 报告期 · 模式
  if (r.intent === "metric_query" && m.metric) {
    const info = document.createElement("span");
    info.textContent = (m.company || "") + " · " + (m.metric || "")
      + (m.period ? " · " + m.period : "") + (m.mode ? " · " + m.mode : "");
    meta.appendChild(info);
  }
  // 数据概览：公司/报告期/指标规模
  else if (r.intent === "data_overview" && m.stats) {
    const s = m.stats;
    const info = document.createElement("span");
    info.textContent = "公司 " + (s.company_count || 0) + " · 报告期 " + (s.report_count || 0)
      + " · 指标 " + (s.metric_count || 0) + " · 字典 " + (s.metric_dict_count || 0);
    meta.appendChild(info);
  }
  // 公司档案：代码 · 行业
  else if (r.intent === "company_query" && m.company) {
    const c = m.company;
    const info = document.createElement("span");
    info.textContent = (c.code || "") + " · " + (c.industry_l1 || "未标注行业")
      + (c.industry_l2 ? " / " + c.industry_l2 : "");
    meta.appendChild(info);
  }
  // 报告：下载 .md
  if (r.intent === "report") {
    if (m.word_count) {
      const info = document.createElement("span");
      info.textContent = m.word_count + " 字 · " + (m.plan_steps || 0) + " 步取数";
      meta.appendChild(info);
    }
    const dl = document.createElement("button");
    dl.className = "dl-btn";
    dl.textContent = "下载 .md";
    dl.onclick = () => downloadMd("财报解读报告", r.reply);
    meta.appendChild(dl);
  }

  b.appendChild(meta);
  wrap.appendChild(b);
  return wrap;
}

/* ===== 对话主流程 ===== */
async function askAgent() {
  const input = $("qaInput");
  const q = input.value.trim();
  if (!q) return;
  input.value = "";
  appendMsg("user", mdEscape(q));
  const typing = appendTyping();
  const tag = typing.querySelector(".agent-tag");
  const btn = $("qaBtn");
  btn.disabled = true;
  try {
    const res = await fetch("/api/agent/chat/stream", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: q }),
    });
    if (!res.ok) throw new Error("请求失败 " + res.status);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        handleSSE(chunk, typing, tag);
      }
    }
  } catch (e) {
    input.value = q;   // 发送失败回填输入，避免用户内容丢失（P2-2）
    typing._stopTyping && typing._stopTyping();
    const wrap = document.createElement("div");
    wrap.className = "msg ai";
    wrap.innerHTML = '<div class="bubble" style="color:var(--red);">处理失败：' + mdEscape(e.message) + "</div>";
    typing.replaceWith(wrap);
  } finally {
    btn.disabled = false;
  }
  scrollChat();
}

// 解析 SSE 事件：stage 更新阶段提示，result/error 渲染最终结果
function handleSSE(chunk, typing, tag) {
  for (const line of chunk.split("\n")) {
    if (!line.startsWith("data: ")) continue;
    let evt;
    try { evt = JSON.parse(line.slice(6)); } catch (e) { continue; }
    if (evt.type === "stage") {
      tag.textContent = "⏳ " + evt.message;
      scrollChat();
    } else if (evt.type === "result") {
      typing._stopTyping && typing._stopTyping();
      typing.replaceWith(renderReply(evt));
    } else if (evt.type === "error") {
      typing._stopTyping && typing._stopTyping();
      const wrap = document.createElement("div");
      wrap.className = "msg ai";
      wrap.innerHTML = '<div class="bubble" style="color:var(--red);">处理失败：' + mdEscape(evt.message) + "</div>";
      typing.replaceWith(wrap);
    }
  }
}

function downloadMd(title, content) {
  const blob = new Blob([content], { type: "text/markdown;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = title.replace(/[\\/:*?"<>|]/g, "_") + ".md";
  a.click();
  URL.revokeObjectURL(a.href);
}

async function clearChat() {
  try {
    await jfetch("/api/agent/clear", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    chatScroll.innerHTML = "";   // 同时清空前端消息区
    toast("对话已清空");
  } catch (e) { toast("清空失败: " + e.message); }
}

/* ===== 顶部状态 ===== */
async function loadSummary() {
  try {
    const r = await fetch("/health");
    if (r.ok) { $("svcDot").style.background = "var(--green)"; $("svcText").textContent = "服务运行中"; }
  } catch (e) { $("svcDot").style.background = "var(--red)"; $("svcText").textContent = "服务未连接"; }
}

/* ===== 事件绑定 ===== */
$("qaInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); askAgent(); }
});

loadSummary();
</script>
</body>
</html>
